name: Cross-platform validation

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Graphviz on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes graphviz

      - name: Install Graphviz on Windows
        if: runner.os == 'Windows'
        run: choco install graphviz --no-progress --yes --force

      - name: Install Graphviz on macOS
        if: runner.os == 'macOS'
        run: brew list graphviz >/dev/null 2>&1 || brew install graphviz

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e .

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Run GUI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/gui_smoke_check.py

      - name: Build source and wheel distributions
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: limndot-dist-${{ runner.os }}
          path: dist/*
