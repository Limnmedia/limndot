[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "limndot"
version = "0.1.0"
description = "A local Graphviz DOT workbench"
readme = "README.md"
requires-python = ">=3.13"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "LIMN MEDIA LLC" }]
dependencies = ["PySide6>=6.8"]

[project.scripts]
limndot = "limndot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/limndot"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
